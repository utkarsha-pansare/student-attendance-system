<!DOCTYPE html>
<html>
<head>
  <title>Mark Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
  <h2>Mark Attendance</h2>
  
<a href="{% url 'defaulters' %}" class="btn btn-outline-secondary btn-sm mb-3">View Defaulters</a>

<form method="post" action="{% url 'logout' %}" class="mb-3">
  {% csrf_token %}
  <button class="btn btn-outline-danger btn-sm">Logout ({{ request.user.username }})</button>
</form>

  {% if request.GET.saved %}
    <div class="alert alert-success">Attendance saved!</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="row mb-3">
      <div class="col">
        <label>Course</label>
        <select name="course" class="form-select">
          {% for c in courses %}
            <option value="{{ c.id }}">{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col">
        <label>Date</label>
        <input type="date" name="date" value="{{ today }}" class="form-control">
      </div>
    </div>

    <table class="table table-bordered">
      <tr><th>Roll No</th><th>Name</th><th>Present</th><th>Absent</th></tr>
      {% for s in students %}
      <tr>
        <td>{{ s.roll_number }}</td>
        <td>{{ s.name }}</td>
        <td><input type="radio" name="status_{{ s.id }}" value="P" checked></td>
        <td><input type="radio" name="status_{{ s.id }}" value="A"></td>
      </tr>
      {% endfor %}
    </table>
    <button class="btn btn-primary">Save Attendance</button>
  </form>
</body>
</html>
